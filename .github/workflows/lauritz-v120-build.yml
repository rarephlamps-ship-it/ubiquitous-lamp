name: Build Lauritz Forensic Explorer v1.2.0 APK

on:
  push:
    branches: [lauritz-v120-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Verify source, test, lint and build v1.2.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v1.1 source and apply v1.2.0 patch
        shell: bash
        run: |
          set -euo pipefail
          cat lauritz-build/source.part00.b64 lauritz-build/source.part01.b64 lauritz-build/source.part02.b64 lauritz-build/source.part03.b64 > lauritz-build/source.b64
          base64 --decode lauritz-build/source.b64 > lauritz-build-src.tar.xz
          echo "d01cbddb6e3a7f45a9ebb2a79e2ff1de285b89c09a71261ac4a2177a2d35e9e0  lauritz-build-src.tar.xz" | sha256sum -c -
          echo "cb94ee5db7defb38406ffefd1fea52c896b9fdec1a829bcd48dd435f67c437db  lauritz-build/fix-001.patch" | sha256sum -c -
          echo "cfe1666f23b799f5e7947315fa7dbd4fed0960b6b7bd9f4f0ded235a0215f465  lauritz-build/fix-v11-001.patch" | sha256sum -c -
          base64 --decode lauritz-build/v11.patch.xz.b64 > v11.patch.xz
          echo "73f015276c11fba3bdb2cbc37827977f5ec251e17fcfb787bb525a819046c40b  v11.patch.xz" | sha256sum -c -

          cat lauritz-build/v12.part00.b64 lauritz-build/v12.part01.b64 lauritz-build/v12.part02.b64 lauritz-build/v12.part03.b64 > v12.patch.xz.b64
          base64 --decode v12.patch.xz.b64 > v12.patch.xz
          echo "b2dd7a8dd049066613487f5828f28516787c731724580d6ae4f423a99a06dc23  v12.patch.xz" | sha256sum -c -

          xz -dc v11.patch.xz > v11.patch
          xz -dc v12.patch.xz > v12.patch
          awk 'BEGIN{skip=0} /^diff --git a\/README.md b\/README.md/{skip=1; next} /^diff --git /{if(skip){skip=0}} !skip{print}' v12.patch > v12-app.patch
          ! grep -q '^diff --git a/README.md b/README.md' v12-app.patch

          rm -rf lauritz-app && mkdir lauritz-app
          tar -xJf lauritz-build-src.tar.xz -C lauritz-app
          patch -d lauritz-app -p1 < lauritz-build/fix-001.patch
          patch -d lauritz-app -p1 --batch < v11.patch || true
          patch -d lauritz-app -p1 < lauritz-build/fix-v11-001.patch
          grep -q 'versionName = "1.1.0"' lauritz-app/app/build.gradle.kts
          grep -q 'versionCode = 2' lauritz-app/app/build.gradle.kts
          patch -d lauritz-app -p1 < v12-app.patch

          grep -q 'versionName = "1.2.0"' lauritz-app/app/build.gradle.kts
          grep -q 'versionCode = 4' lauritz-app/app/build.gradle.kts
          grep -q 'android.permission.INTERNET' lauritz-app/app/src/main/AndroidManifest.xml
          grep -q 'lot_attributes' lauritz-app/app/src/main/java/dk/ruko/lauritz/data/evidence/LauritzSchema.kt
          test -f lauritz-app/app/src/main/java/dk/ruko/lauritz/data/evidence/LotAttributeRepository.kt
          test -f lauritz-app/app/src/main/java/dk/ruko/lauritz/data/visual/VisualImageResolver.kt
          test -f lauritz-app/app/src/main/java/dk/ruko/lauritz/ui/visual/ImageViewerScreen.kt

      - name: Use preinstalled Java 17
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        working-directory: lauritz-app
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Android lint
        working-directory: lauritz-app
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        working-directory: lauritz-app
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify package, permissions, alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="lauritz-app/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/zipalign" -c -P 16 -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$BT/aapt" dump badging "$APK" | tee apk-badging.txt
          "$BT/aapt" dump permissions "$APK" | tee apk-permissions.txt
          grep -q "package: name='dk.ruko.lauritz'" apk-badging.txt
          grep -q "versionCode='4'" apk-badging.txt
          grep -q "versionName='1.2.0'" apk-badging.txt
          grep -q "sdkVersion:'29'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt
          grep -q "android.permission.INTERNET" apk-permissions.txt
          ! grep -Eq "READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE" apk-permissions.txt
          mkdir -p dist
          cp "$APK" dist/Lauritz-Forensic-Explorer-v1.2.0-debug.apk
          sha256sum dist/Lauritz-Forensic-Explorer-v1.2.0-debug.apk > dist/Lauritz-Forensic-Explorer-v1.2.0-debug.apk.sha256
          cat dist/Lauritz-Forensic-Explorer-v1.2.0-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Lauritz-Forensic-Explorer-v1.2.0-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lauritz-Forensic-Explorer-v1.2.0-Diagnostics
          path: |
            apk-signature.txt
            apk-badging.txt
            apk-permissions.txt
            lauritz-app/app/build/reports/tests/
            lauritz-app/app/build/test-results/
            lauritz-app/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Record CI run id and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > lauritz-build/v120-ci-result.txt <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          job_status=${{ job.status }}
          head_sha=${GITHUB_SHA}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lauritz-build/v120-ci-result.txt
          git commit -m "ci: record v1.2.0 result [skip ci]" || exit 0
          git push origin HEAD:lauritz-v120-build
