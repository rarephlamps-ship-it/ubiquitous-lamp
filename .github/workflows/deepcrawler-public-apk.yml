name: Build DeepCrawler Android APK (Public Builder)

on:
  workflow_dispatch:
  push:
    branches:
      - build/deepcrawler-public-apk-v2-20260817
    paths:
      - "deepcrawler-build/**"
      - ".github/workflows/deepcrawler-public-apk.yml"

permissions:
  contents: read

concurrency:
  group: deepcrawler-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Reconstruct, test and build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout public builder branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify DeepCrawler source archive
        shell: bash
        run: |
          set -euo pipefail
          cat deepcrawler-build/source/chunk-*.b64 > deepcrawler-source.b64
          base64 --decode deepcrawler-source.b64 > deepcrawler-source.zip
          echo "3ab787ff6a467d674c8a14eea58743450ce1330330d2b2b2fb695b2867c6a4a4  deepcrawler-source.zip" | sha256sum -c -
          unzip -t deepcrawler-source.zip >/dev/null
          rm -rf work
          mkdir -p work
          unzip -q deepcrawler-source.zip -d work
          test -f work/deepcrawler_android/buildozer.spec
          test -f work/deepcrawler_android/main.py
          test -f work/deepcrawler_android/deepcrawler/engine.py
          grep -q '^version = 2.0.0$' work/deepcrawler_android/buildozer.spec
          grep -q '^android.api = 35$' work/deepcrawler_android/buildozer.spec
          grep -q '^android.minapi = 24$' work/deepcrawler_android/buildozer.spec
          grep -q '^android.ndk = 28c$' work/deepcrawler_android/buildozer.spec
          grep -q '^android.accept_sdk_license = True$' work/deepcrawler_android/buildozer.spec

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Buildozer system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git zip unzip python3-pip python3-virtualenv \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake autopoint gettext ccache
          java -version
          javac -version

      - name: Ensure Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          rustc --version
          cargo --version

      - name: Install Buildozer 1.6.0 and Python build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install "buildozer==1.6.0" setuptools "cython==0.29.34" virtualenv pytest requests beautifulsoup4
          buildozer --version
          cython --version

      - name: Run release gate
        working-directory: work/deepcrawler_android
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m compileall -q main.py deepcrawler

      - name: Build DeepCrawler directly with Buildozer
        id: android-build
        continue-on-error: true
        working-directory: work/deepcrawler_android
        shell: bash
        run: |
          set -o pipefail
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/buildozer.log"

      - name: Upload Buildozer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepCrawler-build-diagnostics
          path: |
            buildozer.log
            work/deepcrawler_android/.buildozer/android/platform/**/*.log
            work/deepcrawler_android/.buildozer/android/platform/**/build/reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when Android compilation failed
        if: steps.android-build.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Set up Android verification tools
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify APK package, SDK, ABIs and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find work/deepcrawler_android/bin -maxdepth 1 -type f -name '*.apk' -print | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null

          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$BT/aapt" dump badging "$APK" | tee apk-badging.txt

          grep -q "package: name='org.deepcrawler.deepcrawler'" apk-badging.txt
          grep -q "sdkVersion:'24'" apk-badging.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'

          mkdir -p dist
          cp "$APK" dist/DeepCrawler-Android-v2.0.0-debug.apk
          (
            cd dist
            sha256sum DeepCrawler-Android-v2.0.0-debug.apk > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          ls -lh dist/

      - name: Upload DeepCrawler APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepCrawler-Android-v2.0.0-APK
          path: |
            dist/DeepCrawler-Android-v2.0.0-debug.apk
            dist/SHA256SUMS.txt
            apk-signature.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30
