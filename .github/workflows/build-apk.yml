name: Build LPFH Deal Cockpit APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify LPFH Deal Cockpit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct verified LPFH source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source/lpfh2-00.b64 \
              source/lpfh2-01.b64 \
              source/lpfh2-02.b64 \
              source/lpfh2-03.b64 \
              source/lpfh2-04.b64 \
              source/lpfh2-05.b64 \
              source/lpfh2-06.b64 \
              source/lpfh2-07.b64 \
              source/lpfh2-08.b64 \
              source/lpfh2-09.b64 \
              source/lpfh2-10.b64 \
              source/lpfh2-11.b64 \
              source/lpfh2-12.b64 > /tmp/lpfh-project.tar.gz.b64
          base64 --decode /tmp/lpfh-project.tar.gz.b64 > /tmp/lpfh-project.tar.gz
          echo "d9bd0c1333d449b879bbc4a74e2b895b10011f5448a4d792cc2186aba425b8a1  /tmp/lpfh-project.tar.gz" | sha256sum -c -
          mkdir -p /tmp/lpfh-project
          tar -xzf /tmp/lpfh-project.tar.gz -C /tmp/lpfh-project
          test -f /tmp/lpfh-project/android/settings.gradle
          test -f /tmp/lpfh-project/android/app/build.gradle
          test -f /tmp/lpfh-project/android/app/src/main/AndroidManifest.xml
          test -f /tmp/lpfh-project/dist/index.html
          grep -q "dk.ruko.lpfhdeal" /tmp/lpfh-project/android/app/build.gradle
          grep -q "minSdk 26" /tmp/lpfh-project/android/app/build.gradle

      - name: Generate local Danish onboarding voice
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
          cd /tmp/lpfh-project
          TEXT='Denne app samler værdiansættelse, evidensoversigt og forhandlingsscenarier i ét cockpit. Juster aktiver, rettigheder, retainere og success fee og se den samlede dealværdi med det samme. Evidensoversigten viser readiness, nøglefund og status på de centrale spor. Gem tilbud og modbud, sammenlign scenarier og opret låste snapshots til møder og forhandling. I præsentationstilstand vises kun de oplysninger, du vil dele med køberen. Eksportér snapshots som PDF, JSON eller CSV og brug appen både som værktøj og præsentation.'
          mkdir -p dist/public/onboarding
          espeak -v da -s 240 -w /tmp/lpfh-voice.wav "$TEXT"
          ffmpeg -loglevel error -y -i /tmp/lpfh-voice.wav -codec:a libmp3lame -q:a 4 dist/public/onboarding/voice-da.mp3
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 dist/public/onboarding/voice-da.mp3)
          python3 - "$duration" <<'PY'
          import sys
          duration=float(sys.argv[1])
          assert 15 <= duration <= 30, f"onboarding duration outside approved range: {duration}"
          print(f"ONBOARDING_DURATION={duration:.2f}s")
          PY

      - name: Prepare Android WebView assets
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/lpfh-project
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main/assets/www/src/app.js
          test -f android/app/src/main/assets/www/public/onboarding/voice-da.mp3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android project
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd /tmp/lpfh-project
          gradle -p android --no-daemon --stacktrace clean assembleDebug > build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "=== COMPILER ERROR SUMMARY ==="
            grep -nE "error:|FAILURE:|What went wrong|Execution failed|Caused by:|Android resource linking failed|AAPT|Could not" build.log | tail -n 260 || true
            echo "=== FINAL 360 LOG LINES ==="
            tail -n 360 build.log
          } > build-summary.txt
          cat build-summary.txt
          exit 0

      - name: Verify APK package, alignment and signatures
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/lpfh-project
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tee zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$BT/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='dk.ruko.lpfhdeal'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          grep -q "Verified using v1 scheme (JAR signing): true" apk-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature.txt
          mkdir -p release
          cp "$APK" "release/LPFH-Deal-Cockpit-v1.0.0-debug.apk"
          sha256sum "release/LPFH-Deal-Cockpit-v1.0.0-debug.apk" > "release/LPFH-Deal-Cockpit-v1.0.0-debug.apk.sha256"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 dist/public/onboarding/voice-da.mp3 > release/onboarding-duration-seconds.txt
          cp apk-signature.txt apk-badging.txt zipalign.txt release/
          ls -lh release/

      - name: Upload LPFH APK artifact
        if: steps.compile.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: LPFH-Deal-Cockpit-v1
          path: /tmp/lpfh-project/release/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LPFH-Deal-Cockpit-Diagnostics
          path: |
            /tmp/lpfh-project/build.log
            /tmp/lpfh-project/build-summary.txt
            /tmp/lpfh-project/release/apk-signature.txt
            /tmp/lpfh-project/release/apk-badging.txt
            /tmp/lpfh-project/release/zipalign.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when compilation failed
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: exit 1
